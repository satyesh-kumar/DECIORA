<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- DECIORA Strategic Command Insignia (PS26048) -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#12263A" />
      <stop offset="100%" stopColor="#07111F" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#7DD3FC" />
      <stop offset="50%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Tactical Bezel -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="url(#shieldGrad)" stroke="#38BDF8" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Outer Telemetry Radar Ring -->
  <circle cx="32" cy="32" r="21" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.6" />
  
  <!-- Inner Targeting Crosshairs -->
  <line x1="32" y1="13" x2="32" y2="19" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="45" x2="32" y2="51" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <line x1="13" y1="32" x2="19" y2="32" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <line x1="45" y1="32" x2="51" y2="32" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />

  <!-- Radio Signal Waveform Arcs -->
  <path d="M 23,26 A 11,11 0 0,1 41,26" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 26,29 A 7,7 0 0,1 38,29" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />

  <!-- Central Strategic Chevron / Delta Apex -->
  <polygon points="32,23 41,39 32,35 23,39" fill="url(#cyanGrad)" filter="url(#cyanGlow)" />

  <!-- Core Pulse Point -->
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />
</svg>